# TEST-ONLY golden fixture (opensrm-wo62.4.2; re-cited opensrm-wo62.4.6) — not
# a shipped example.
#
# Exists to reach two branches of the manifest path's dependency technology
# extraction in src/nthlayer_generate/specs/helpers.py:
#
# * :51-52 in dependency_technology — a database with no `type:` maps to no
#   technology, so mysql-orders gets no database alerts. (The removed legacy
#   extractor inferred mysql from the name; the manifest path deliberately
#   does not.) Every shipped example gives databases an explicit type.
# * :70 in extract_dependency_technologies — the order-preserving dedup.
#   postgres-main and postgres-replica both declare postgres; without the
#   dedup the postgres alerts are emitted twice. No shipped example repeats a
#   technology.
#
# Adapted from examples/services/checkout-service.yaml (service block, SLO,
# Dependencies shape) and examples/services/payment-api-with-deps.yaml
# (postgres-main / name-prefix naming).

service:
  name: checkout-db-deps
  team: commerce
  tier: critical
  type: api

resources:
  - kind: SLO
    name: availability
    spec:
      objective: 99.95
      window: 30d
      indicators:
        - type: availability
          success_ratio:
            total_query: sum(rate(http_requests_total{service="checkout-db-deps"}[5m]))
            good_query: sum(rate(http_requests_total{service="checkout-db-deps",status!~"5.."}[5m]))

  - kind: Dependencies
    name: dependencies
    spec:
      databases:
        - name: mysql-orders
          version: "8.0"
        - type: postgres
          name: postgres-main
        - type: postgres
          name: postgres-replica
